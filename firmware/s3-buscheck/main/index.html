<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscheck</title>
<style>
body{font:18px system-ui,sans-serif;background:#f3f5f7;color:#17212b;max-width:26rem;margin:3rem auto;padding:1rem}
h1{font-size:2rem}button{font:inherit;padding:1rem 2rem;border:0;border-radius:.7rem;background:#165dcc;color:white;min-height:3rem}
button:last-child{background:#35404c}button:disabled{opacity:.5}nav{display:flex;gap:1rem}#error{color:#a32121;overflow-wrap:anywhere}
</style>
<h1>Buscheck</h1>
<p id="state" role="status">Connecting…</p>
<nav aria-label="Controls"><button id="start" type="button">Start</button><button id="stop" type="button">Stop</button></nav>
<p>Started sessions: <span id="sent">0</span></p>
<p id="error" role="alert"></p>
<script>
const state=document.querySelector('#state'),error=document.querySelector('#error');
const buttons=[...document.querySelectorAll('button')];
function show(s){state.textContent=s.running?'Running':'Stopped';document.querySelector('#sent').textContent=s.sent;error.textContent=s.error||''}
let latest=0;
async function request(path,method='GET'){
 const version=++latest;
 try{
  const r=await fetch(path,{method,cache:'no-store'}),s=await r.json();
  if(version!==latest)return;
  show(s);if(!r.ok)throw Error(s.error||'Please try again');
 }catch(e){if(version===latest)throw e}
}
let busy=false;
async function refresh(){if(busy)return;try{await request('/status')}catch(e){state.textContent='Unavailable';error.textContent=e.message}}
for(const b of buttons)b.onclick=async()=>{busy=true;buttons.forEach(x=>x.disabled=true);try{await request('/'+b.id,'POST')}catch(e){error.textContent=e.message}finally{busy=false;buttons.forEach(x=>x.disabled=false)}};
refresh();setInterval(refresh,1000);
</script>
</html>
